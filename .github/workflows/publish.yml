name: Publish to npm

# Publishes with npm TRUSTED PUBLISHING (OIDC). There is no npm token here, in
# a repo secret, or on anyone's machine -- see oss/RELEASING.md in the monorepo.
#
# THE TRAP, because this cost three failed runs to find and the errors actively
# mislead. actions/setup-node with registry-url writes an .npmrc containing:
#
#     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
#
# With no NODE_AUTH_TOKEN set that is an EMPTY token. npm then authenticates as
# nobody instead of falling back to OIDC, and the registry answers
# `404 Not Found - PUT` -- an authorization failure wearing a status code that
# reads like the package does not exist. It does exist, and the trusted
# publisher was configured correctly the whole time.
#
# Dropping registry-url instead is NOT the fix: npm then has no registry
# configured, never attempts the exchange, and fails with ENEEDAUTH. Both
# failure modes are logged in actions/setup-node#1551 and npm/documentation#1960.
#
# The fix is to keep registry-url and delete the _authToken line it wrote,
# before publishing. Node 24 also matters: node 22 ships npm 10, which cannot do
# the OIDC handshake at all and produces the same misleading 404.
#
# THE ACTUAL ROOT CAUSE, found last and worth naming: npm's trusted publisher
# for this package had its ENVIRONMENT NAME set to "publish.yml" -- the workflow
# filename had been entered into both fields. This workflow declares no
# environment, so the OIDC claim could never match and npm rejected every
# exchange. npm does not validate that config when you save it, and reports the
# mismatch as 404 or ENEEDAUTH rather than saying the publisher did not match
# (npm/cli#9088). If publishing ever fails this way again, check the npm-side
# config BEFORE touching this file.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC; without it there is no token to exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.x. Node 22 ships npm 10, which cannot do the
          # OIDC handshake. Do not lower this.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # A release build must never publish from a warm cache.
          package-manager-cache: false

      - name: Remove the empty _authToken that shadows OIDC
        run: |
          set -eu
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "npmrc after stripping the auth line:"
            cat "$npmrc"
          else
            echo "No npmrc at $npmrc -- nothing to strip."
          fi

      - name: Test
        run: node test/run.js

      - name: Publish
        run: npm publish --access public
